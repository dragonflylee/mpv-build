name: deb

on:
  push:
    branches: [ armbian ]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.mpv.outputs.version }}
    steps:
    - name: Resolve mpv master HEAD
      id: mpv
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        short_sha=$(gh api "repos/mpv-player/mpv/commits/master" --jq .sha | cut -c1-7)
        raw=$(gh api "repos/mpv-player/mpv/contents/MPV_VERSION?ref=${short_sha}" --jq .content \
          | base64 -d | tr -d '[:space:]' || true)
        raw=${raw:-0.0.0-UNKNOWN}
        case "$raw" in
          *-UNKNOWN) version="${raw%UNKNOWN}${short_sha}" ;;
          *)         version="$raw" ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "mpv master HEAD: $short_sha -> $version"

  upload-release:
    needs: [ build-deb ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Assets
      uses: actions/download-artifact@v8
    - name: Release and Upload Assets
      uses: softprops/action-gh-release@v3
      with:
        tag_name: deb
        files: mpv-*/mpv_*.deb

  build-deb:
    needs: [ version ]
    strategy:
      fail-fast: false
      matrix:
        include:
        - { img: ubuntu, tag: jammy }
        - { img: ubuntu, tag: noble }
        - { img: debian, tag: bookworm }
        - { img: debian, tag: trixie }
        - { arch: x86_64, runner: ubuntu-24.04 }
        - { arch: aarch64, runner: ubuntu-24.04-arm }
        arch: [ x86_64, aarch64 ]
        tag: [ jammy, noble, bookworm, trixie ]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.img }}:${{ matrix.tag }}
    steps:
    - name: Install dependency
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends debhelper cmake build-essential ninja-build nasm python3-setuptools wget git \
          ca-certificates xorg-dev libxpresent-dev libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev libv4l-dev \
          libpulse-dev libuchardet-dev libva-dev libudev-dev libdrm-dev libgbm-dev libssl-dev liblua5.2-dev
        wget -qO- https://github.com/mesonbuild/meson/archive/1.9.0.tar.gz | tar zxf - -C /tmp
        cd /tmp/meson-1.9.0 && python3 setup.py install > /dev/null 2>&1
    - uses: actions/checkout@v7
    - name: Set version from mpv commit
      env:
        MPV_VERSION: ${{ needs.version.outputs.version }}
        AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
        AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
      run: |
        {
          printf 'mpv (%s) unstable; urgency=medium\n\n' "$MPV_VERSION"
          printf '  * Automatic build of mpv-player/mpv master (%s)\n\n' "$MPV_VERSION"
          printf ' -- %s <%s>  %s\n\n' "$AUTHOR_NAME" "$AUTHOR_EMAIL" "$(date -R)"
          cat debian/changelog
        } > debian/changelog.new
        mv debian/changelog.new debian/changelog
        head -6 debian/changelog
    - name: Build deb
      env:
        DH_QUIET: "1"
      run: |
        make -f debian/rules depends
        dpkg-buildpackage -b -nc
        mv ../*.deb "$GITHUB_WORKSPACE"

    - name: Rename deb files
      run: |
        for f in *.deb; do
          [ -e "$f" ] || continue
          mv -v "$f" "${f%.deb}_${{ matrix.tag }}.deb"
        done

    - name: Archive Build Logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.tag }}-${{ matrix.arch }}
        path: |
          build-ffmpeg/ffbuild
          build-*/meson-logs
    - name: Upload Assets
      uses: actions/upload-artifact@v7
      with:
        name: mpv-${{ matrix.img }}-${{ matrix.tag }}-${{ matrix.arch }}-${{ github.run_number }}
        if-no-files-found: error
        path: |
          mpv_*.deb
          libmpv2_*.deb
          libmpv-dev_*.deb
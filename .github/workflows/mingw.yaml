name: mingw

on:
  push:
    branches: [ mingw ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { sys: mingw64, env: x86_64 }
        - { sys: mingw32, env: i686 }
        - { sys: clangarm64, env: clang-aarch64 }
    name: ${{ matrix.sys }}
    runs-on: ${{ contains(matrix.sys, 'arm64') && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      GITFLAGS: --mirror --no-single-branch --depth=1
      PKGDEST: ${{ github.workspace }}/_pkgs
    steps:
    - name: Disable autocrlf
      shell: bash
      run: git config --global core.autocrlf false
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        cache: false
        release: ${{ contains(matrix.sys, 'arm64') }}
        install: >-
          patch
          unzip
          make
          git
          diffutils
          nasm
          xxhash
          mingw-w64-${{matrix.env}}-meson
          mingw-w64-${{matrix.env}}-cmake
          mingw-w64-${{matrix.env}}-cc
    - uses: actions/checkout@v7
    - name: Cache dependency packages
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ env.PKGDEST }}
        key: pkgs-${{ matrix.sys }}-${{ hashFiles('*/PKGBUILD', '*/*.patch') }}
    - name: Build dependency packages
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        for pkg in curl libwebp freetype harfbuzz fribidi libass dav1d ffnvcodec-headers ffmpeg spirv-headers spirv-tools glslang spirv-cross shaderc libplacebo; do
          pushd $pkg
          makepkg-mingw -sciCf --noconfirm
          popd
        done
    - name: Build mpv
      run: |
        pushd mpv
        makepkg-mingw -sciCf --noconfirm
        popd
    - name: Archive dependency packages
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.sys }}-deps-${{ github.run_number }}
        path: ${{ env.PKGDEST }}/*.pkg.tar.zst
    - name: Archive Build Logs
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.sys }}-${{ github.run_number }}
        path: ${{ env.PKGDEST }}/mingw-w64-*-mpv-*.pkg.tar.zst
    - name: Release packages
      uses: softprops/action-gh-release@v3
      with:
        tag_name: mingw-package
        prerelease: true
        files: ${{ env.PKGDEST }}/mingw-w64-*-mpv-*.pkg.tar.zst
        body: |
          ![download](https://img.shields.io/github/downloads/${{ github.repository }}/mingw-package/total?label=Downloads)
